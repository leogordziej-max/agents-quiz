<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau des agents</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1d1a16;--muted:#6f675c;--line:#e3ddd1;--acc:#e8a400;--ok:#2f9e5b;--work:#3b6fd8;
  --floor:#e2cfae;--floor2:#d8c39f;--wall:#5b4a3a;--desk:#a87b52;--desk2:#8a6140;--rug:#c9d8c5;--rug2:#b7cab2;--sofa:#5f7fa8;--off:#2a2c35;--pants:#33384a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--panel:#1f1c17;--ink:#f1ece2;--muted:#a59c8e;--line:#332e26;--acc:#f0b429;--ok:#4cc77e;--work:#6f9bff;
  --floor:#3b3226;--floor2:#352d22;--wall:#1b1712;--desk:#7a5536;--desk2:#5f4129;--rug:#34453a;--rug2:#2e3d33;--sofa:#3e5679;--off:#111216;--pants:#4a5068}}
:root[data-theme="dark"]{--bg:#15130f;--panel:#1f1c17;--ink:#f1ece2;--muted:#a59c8e;--line:#332e26;--acc:#f0b429;--ok:#4cc77e;--work:#6f9bff;
  --floor:#3b3226;--floor2:#352d22;--wall:#1b1712;--desk:#7a5536;--desk2:#5f4129;--rug:#34453a;--rug2:#2e3d33;--sofa:#3e5679;--off:#111216;--pants:#4a5068}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.top{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.top{grid-template-columns:1.1fr 1fr}}
.scene{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--wall);max-width:480px;width:100%;margin:0 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:360/560}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:15px;margin:0 0 8px}
.side{display:flex;flex-direction:column;gap:14px}
.now .who{font-weight:700}.now .role{color:var(--muted);font-size:13px}
.now ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.now .msg{margin-top:6px;font-weight:600}
.tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:0 6px;vertical-align:2px}
.log{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:220px;overflow:auto;color:var(--muted)}
.log b{color:var(--ink);font-weight:600}
video{width:100%;max-width:260px;display:block;margin:0 auto;border-radius:12px;background:#000;aspect-ratio:9/16}
.waiting{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bureau des agents</h1>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <button id="play">▶ Lancer le rejeu</button>
    <span class="clock" id="clock">pause café en cours</span>
  </div>
  <div class="top">
    <div class="scene"><canvas id="cv" width="360" height="560" role="img" aria-label="Vue de dessus du bureau : sept agents qui se promènent et travaillent"></canvas></div>
    <div class="side">
      <div class="card now" id="now"><h2>En ce moment</h2><div class="waiting">Personne ne travaille : ils traînent dans la pièce en attendant le lancement.</div></div>
      <div class="card"><h2>Résultat</h2><div id="result"><div class="waiting">La vidéo apparaîtra quand Sam aura validé.</div></div></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Journal</h2><div class="log" id="log"><div>En attente…</div></div></div>
  <p class="note" id="note"></p>
</div>
<script>
const RUN = __RUN__;
const SHIRTS=["#d9534f","#e8a400","#2f9e5b","#3b6fd8","#8e5bd8","#d15ba8","#2aa3a3"];
const HAIR=["#5a3825","#1f1b18","#b5651d","#2b2b2b","#e0b04a","#7a2e1f","#3a2a1a"];
const SKIN=["#f1c7a1","#c68a5e","#f3d2b5","#8d5a3b","#eab890","#d9a27a","#f6cfae"];
const LONG=[true,false,true,false,true,false,false];
const TAGS=RUN.source==="gemini"?{"Noé":"comptes à connecter"}:{"Hugo":"mode secours","Noé":"comptes à connecter"};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const d=new Date(RUN.debut);
document.getElementById('sub').textContent=`Dernier run : ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} à ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} · ${RUN.agents.length} agents · ${RUN.duree_totale} s au total`;

/* ---------- plan de la pièce (vue de dessus, 360×560) ---------- */
const W=360,H=560,PI=Math.PI;
// bureaux dans l'ordre de la chaîne : gauche ↓, droite ↑, puis en haut
const DESKS=[
 {side:'L',cy:100},{side:'L',cy:200},{side:'L',cy:300},
 {side:'R',cy:300},{side:'R',cy:200},{side:'R',cy:100},
 {side:'T',cx:180}];
DESKS.forEach(k=>{
  if(k.side==='L'){k.seat=[82,k.cy];k.ang=PI;k.access=[118,k.cy];k.paper=[44,k.cy+10];k.badge=[56,k.cy-22]}
  if(k.side==='R'){k.seat=[278,k.cy];k.ang=0;k.access=[242,k.cy];k.paper=[316,k.cy+10];k.badge=[304,k.cy-22]}
  if(k.side==='T'){k.seat=[180,74];k.ang=-PI/2;k.access=[180,112];k.paper=[198,40];k.badge=[214,22]}
});
const POI=[
 {name:'café',pt:[62,512],ang:PI,dur:[3,5],icon:'☕'},
 {name:'canapé',pt:[148,510],ang:-PI/2,dur:[4,7],sit:true},
 {name:'canapé',pt:[180,510],ang:-PI/2,dur:[4,7],sit:true},
 {name:'canapé',pt:[212,510],ang:-PI/2,dur:[4,7],sit:true},
 {name:'plante',pt:[306,512],ang:0,dur:[2,3],icon:'💧'},
 {name:'fontaine',pt:[300,410],ang:0,dur:[2,4],icon:'🥤'},
 {name:'livres',pt:[56,410],ang:PI,dur:[3,5],icon:'📖'},
];
const rnd=(a,b)=>a+Math.random()*(b-a);
const freePt=()=>[rnd(125,235),rnd(125,460)];

/* ---------- agents ---------- */
const agents=RUN.agents.map((a,i)=>{
  const p=freePt();
  return {...a,i,x:p[0],y:p[1],ang:rnd(-PI,PI),path:[],speed:55,mode:'idle',pause:rnd(0,2),act:null,walkT:0,done:false,atDesk:false,onArrive:null};
});
function setPath(a,pts){
  const p=[];
  if(a.atDesk){p.push(DESKS[a.i].access);a.atDesk=false}
  a.path=p.concat(pts);a.act=null;
}
function idleChoice(a){
  const r=Math.random();
  const busy=new Set(agents.filter(b=>b!==a).flatMap(b=>[b.act,b.pending].filter(Boolean).map(p=>p.pt.join())));
  if(r<.45){setPath(a,[freePt()]);a.pause=rnd(.8,2.5);return}
  const opts=POI.filter(p=>!busy.has(p.pt.join()));
  const p=opts[Math.floor(Math.random()*opts.length)];
  setPath(a,[p.pt]);a.pending=p;
}
function callToDesk(a){
  return new Promise(res=>{a.mode='toDesk';a.speed=120;a.pending=null;a.act=null;
    if(a.atDesk){res();return}
    setPath(a,[DESKS[a.i].access,DESKS[a.i].seat]);a.onArrive=()=>{a.atDesk=true;a.ang=DESKS[a.i].ang;res()}});
}
function release(a){a.mode='idle';a.speed=55;a.pause=rnd(.8,1.8)}

function update(a,dt){
  if(a.mode==='work')return;
  if(a.path.length){
    const [tx,ty]=a.path[0],dx=tx-a.x,dy=ty-a.y,dist=Math.hypot(dx,dy);
    const step=a.speed*dt;
    if(dist>.5){const want=Math.atan2(dy,dx);let da=((want-a.ang+PI*3)%(2*PI))-PI;a.ang+=da*Math.min(1,dt*10)}
    if(dist<=step){a.x=tx;a.y=ty;a.path.shift();
      if(!a.path.length){
        if(a.onArrive){const f=a.onArrive;a.onArrive=null;f();return}
        if(a.pending){a.act=a.pending;a.ang=a.pending.ang;a.pause=rnd(...a.pending.dur);a.pending=null}
      }}
    else{a.x+=dx/dist*step;a.y+=dy/dist*step;a.walkT+=dt*a.speed/9}
    return;
  }
  if(a.mode==='idle'){a.pause-=dt;if(a.pause<=0)idleChoice(a)}
}

/* ---------- dessin ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let C={};
function readColors(){const s=getComputedStyle(document.documentElement);['floor','floor2','wall','desk','desk2','rug','rug2','sofa','off','pants','ok','work','ink','panel','muted'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
readColors();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
function fit(){const r=Math.min(3,window.devicePixelRatio||1);cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0)}
fit();
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
const state={deskDone:new Set(),working:-1,paperAt:-1,fly:null};

function drawRoom(t){
  ctx.fillStyle=C.wall;ctx.fillRect(0,0,W,H);
  // parquet
  for(let y=8;y<H-8;y+=16){for(let x=8;x<W-8;x+=48){const o=(y/16)%2?24:0;ctx.fillStyle=(((x+o)/48|0)*7+(y/16|0)*3)%4<2?C.floor:C.floor2;ctx.fillRect(x+o-24,y,48,16)}}
  ctx.fillStyle=C.wall;ctx.fillRect(0,0,W,8);ctx.fillRect(0,H-8,W,8);ctx.fillRect(0,0,8,H);ctx.fillRect(W-8,0,8,H);
  // fenêtres
  ctx.fillStyle='#9fd3f0';[[40,0,70],[250,0,70]].forEach(([x,y,w])=>ctx.fillRect(x,y+2,w,5));
  ctx.fillRect(W-6,380,4,60);
  // porte
  ctx.fillStyle=C.desk2;ctx.fillRect(W-8,470,8,0);
  // tapis
  rr(128,170,104,170,12);ctx.fillStyle=C.rug;ctx.fill();rr(138,180,84,150,8);ctx.strokeStyle=C.rug2;ctx.lineWidth=3;ctx.stroke();
  // bibliothèque
  ctx.fillStyle=C.desk2;ctx.fillRect(10,370,22,90);
  const bc=['#d9534f','#3b6fd8','#e8a400','#2f9e5b','#8e5bd8','#2aa3a3'];
  for(let k=0;k<11;k++){ctx.fillStyle=bc[k%6];ctx.fillRect(13,374+k*8,16,6)}
  // machine à café
  rr(12,494,30,36,4);ctx.fillStyle='#3a3a3a';ctx.fill();ctx.fillStyle='#c0392b';ctx.fillRect(18,500,6,6);ctx.fillStyle='#ddd';ctx.fillRect(26,512,10,10);
  // canapé
  rr(122,526,116,26,8);ctx.fillStyle=C.sofa;ctx.fill();
  rr(126,518,108,14,6);ctx.fillStyle=C.sofa;ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
  rr(116,512,12,40,5);ctx.fill();rr(232,512,12,40,5);ctx.fill();
  ctx.fillStyle='#0002';[160,196].forEach(x=>ctx.fillRect(x,518,1.5,14));
  // plante
  ctx.fillStyle='#b0603a';ctx.beginPath();ctx.arc(330,528,11,0,7);ctx.fill();
  ctx.fillStyle='#3f9b57';for(let k=0;k<7;k++){const a=k/7*2*PI+Math.sin(t/900)*.08;ctx.beginPath();ctx.ellipse(330+Math.cos(a)*10,528+Math.sin(a)*10,9,5,a,0,7);ctx.fill()}
  // fontaine
  ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(330,410,12,0,7);ctx.fill();ctx.fillStyle='#7fc4ef';ctx.beginPath();ctx.arc(330,410,8,0,7);ctx.fill();
  // bureaux
  DESKS.forEach((k,i)=>{
    const work=state.working===i,done=state.deskDone.has(i);
    const scr=work?C.work:done?C.ok:C.off;
    // chaise (si l'agent n'y est pas)
    if(k.side==='L'){rr(10,k.cy-30,54,60,4);ctx.fillStyle=C.desk;ctx.fill();ctx.fillStyle=C.desk2;ctx.fillRect(10,k.cy-30,54,3);
      ctx.fillStyle='#444';ctx.fillRect(16,k.cy-14,5,28);ctx.fillStyle=scr;ctx.fillRect(21,k.cy-13,2.5,26);
      ctx.fillStyle='#cfcfcf';ctx.fillRect(44,k.cy-9,7,18);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(52,k.cy-20,3.5,0,7);ctx.fill()}
    if(k.side==='R'){rr(296,k.cy-30,54,60,4);ctx.fillStyle=C.desk;ctx.fill();ctx.fillStyle=C.desk2;ctx.fillRect(296,k.cy-30,54,3);
      ctx.fillStyle='#444';ctx.fillRect(339,k.cy-14,5,28);ctx.fillStyle=scr;ctx.fillRect(336.5,k.cy-13,2.5,26);
      ctx.fillStyle='#cfcfcf';ctx.fillRect(309,k.cy-9,7,18);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(308,k.cy-20,3.5,0,7);ctx.fill()}
    if(k.side==='T'){rr(146,10,68,46,4);ctx.fillStyle=C.desk;ctx.fill();
      ctx.fillStyle='#444';ctx.fillRect(166,14,28,5);ctx.fillStyle=scr;ctx.fillRect(167,19,26,2.5);
      ctx.fillStyle='#cfcfcf';ctx.fillRect(171,40,18,7);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(156,24,3.5,0,7);ctx.fill()}
    if(work){const [sx,sy]=k.side==='L'?[24,k.cy]:k.side==='R'?[336,k.cy]:[180,22];
      const g=ctx.createRadialGradient(sx,sy,2,sx,sy,30);g.addColorStop(0,C.work+'88');g.addColorStop(1,C.work+'00');ctx.fillStyle=g;ctx.fillRect(sx-30,sy-30,60,60)}
    // chaise
    const [cx,cy]=k.seat;ctx.fillStyle='#3d3a45';ctx.beginPath();ctx.arc(cx+(k.side==='L'?6:k.side==='R'?-6:0),cy+(k.side==='T'?6:0),11,0,7);ctx.fill();
    if(done){const [bx,by]=k.badge;ctx.fillStyle=C.ok;ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(bx-3.3,by);ctx.lineTo(bx-1,by+2.5);ctx.lineTo(bx+3.5,by-2.5);ctx.stroke()}
  });
}
function drawPaper(x,y,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#fff';ctx.strokeStyle='#0004';ctx.lineWidth=.8;ctx.fillRect(-6,-7.5,12,15);ctx.strokeRect(-6,-7.5,12,15);ctx.fillStyle='#0004';for(let k=0;k<3;k++)ctx.fillRect(-3.5,-4+k*3.5,7,1);ctx.restore()}
function drawAgent(a,t){
  const i=a.i,moving=a.path.length>0,sit=a.act&&a.act.sit,working=a.mode==='work';
  ctx.save();ctx.translate(a.x,a.y);
  ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(1.5,2,13,10,0,0,7);ctx.fill();
  ctx.rotate(a.ang);
  // pieds / jambes
  if(moving){const s=Math.sin(a.walkT)*5;ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(s,-5,4,2.6,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(-s,5,4,2.6,0,0,7);ctx.fill()}
  else if(sit||a.atDesk||working){ctx.fillStyle=C.pants;rr(4,-7,12,5,2.5);ctx.fill();rr(4,2,12,5,2.5);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(15,-7,3,5);ctx.fillRect(15,2,3,5)}
  // bras
  ctx.fillStyle=SKIN[i];
  if(working){const o=Math.sin(t/70)*2.2;ctx.beginPath();ctx.arc(11+o,-6,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(11-o,6,3,0,7);ctx.fill()}
  else if(moving){const s=Math.sin(a.walkT)*3;ctx.beginPath();ctx.arc(-s,-11,2.8,0,7);ctx.fill();ctx.beginPath();ctx.arc(s,11,2.8,0,7);ctx.fill()}
  else if(a.act&&a.act.icon==='☕'){ctx.beginPath();ctx.arc(8,-7,2.8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(10,-7,2.4,0,7);ctx.fill()}
  // épaules
  ctx.fillStyle=SHIRTS[i];const br=working?Math.sin(t/300)*.4:Math.sin(t/700+i)*.5;
  ctx.beginPath();ctx.ellipse(0,0,7.5,12+br,0,0,7);ctx.fill();
  // tête
  const nod=working?Math.sin(t/180)*1:0;
  ctx.fillStyle=SKIN[i];ctx.beginPath();ctx.arc(1+nod,0,6.6,0,7);ctx.fill();
  ctx.fillStyle=HAIR[i];ctx.beginPath();ctx.arc(-1+nod,0,6.6,0,7);ctx.fill();
  if(LONG[i]){ctx.beginPath();ctx.ellipse(-5.5,0,4,7,0,0,7);ctx.fill()}
  ctx.restore();
  // étiquette
  ctx.font='600 9px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(a.nom).width+8;
  ctx.fillStyle=C.panel+'dd';rr(a.x-w/2,a.y-26,w,12,6);ctx.fill();ctx.fillStyle=C.ink;ctx.fillText(a.nom,a.x,a.y-19.6);
  // bulles
  if(working){ctx.fillStyle=C.panel;rr(a.x+8,a.y-44,26,14,7);ctx.fill();ctx.strokeStyle=C.work;ctx.lineWidth=1;ctx.stroke();
    for(let k=0;k<3;k++){ctx.globalAlpha=.35+.65*((Math.sin(t/160-k)+1)/2);ctx.fillStyle=C.work;ctx.beginPath();ctx.arc(a.x+15+k*6,a.y-37,1.8,0,7);ctx.fill()}ctx.globalAlpha=1}
  else if(a.act&&a.act.icon&&!moving){ctx.font='11px system-ui';ctx.fillText(a.act.icon,a.x+14,a.y-34+Math.sin(t/400)*1.5)}
  else if(a.mode==='toDesk'){ctx.font='700 10px system-ui';ctx.fillStyle=C.work;ctx.fillText('!',a.x+12,a.y-34)}
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  agents.forEach(a=>update(a,dt));
  drawRoom(t);
  if(state.paperAt>=0&&!state.fly){const [px,py]=DESKS[state.paperAt].paper;drawPaper(px,py,-.15)}
  [...agents].sort((a,b)=>a.y-b.y).forEach(a=>drawAgent(a,t));
  if(state.fly){const f=state.fly,k=Math.min(1,(t-f.t0)/f.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const x=f.a[0]+(f.b[0]-f.a[0])*e,y=f.a[1]+(f.b[1]-f.a[1])*e-Math.sin(PI*e)*50;drawPaper(x,y,e*PI*2);
    if(k>=1){state.fly=null;state.paperAt=f.to;f.res()}}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function flyPaper(from,to){return new Promise(res=>{const a=from<0?[180,300]:DESKS[from].paper;state.fly={a,b:DESKS[to].paper,t0:performance.now(),dur:750,to,res}})}

/* ---------- rejeu ---------- */
const log=document.getElementById('log'),clock=document.getElementById('clock'),now=document.getElementById('now');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let t0;
function line(txt){const s=((performance.now()-t0)/1000).toFixed(1).padStart(5,' ');const div=document.createElement('div');div.innerHTML=`[${s}s] ${txt}`;log.appendChild(div);log.scrollTop=log.scrollHeight}
function showNow(a,st){
  const head=`<h2>En ce moment</h2><div class="who">${esc(a.nom)}${TAGS[a.nom]?`<span class="tag">${TAGS[a.nom]}</span>`:''}</div><div class="role">${esc(a.role)}</div>`;
  now.innerHTML=head+(st==='go'?`<div class="msg" style="color:var(--muted)">file à son bureau…</div>`:st==='work'?`<div class="msg" style="color:var(--work)">travaille…</div>`:
   `<div class="msg">✓ ${esc(a.message)} <span style="color:var(--muted);font-weight:400">(${a.duree.toFixed(1)} s réelles)</span></div><ul>${a.details.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
}
async function play(){
  const btn=document.getElementById('play');btn.disabled=true;
  log.innerHTML='';document.getElementById('result').innerHTML='<div class="waiting">La vidéo apparaîtra quand Sam aura validé.</div>';
  state.deskDone.clear();state.paperAt=-1;state.working=-1;
  t0=performance.now();
  const tick=setInterval(()=>clock.textContent=`rejeu ${((performance.now()-t0)/1000).toFixed(1)} s`,100);
  for(let i=0;i<agents.length;i++){
    const a=agents[i];
    showNow(a,'go');line(`<b>${esc(a.nom)}</b> est appelé·e à son bureau`);
    await callToDesk(a);
    await flyPaper(i===0?-1:i-1,i);
    a.mode='work';state.working=i;showNow(a,'work');
    line(`<b>${esc(a.nom)}</b> s'y met : ${esc(a.role.toLowerCase())}`);
    await sleep(Math.min(4500,Math.max(1800,a.duree*200)));
    if(a.statut!=='ok'){state.working=-1;now.innerHTML=`<h2>En ce moment</h2><div class="who">${esc(a.nom)}</div><div class="msg" style="color:#d9534f">✘ ${esc(a.message)}</div>`;line(`<b>${esc(a.nom)}</b> ✘ ${esc(a.message)}`);document.getElementById('result').innerHTML='<div class="waiting">Ce run a échoué : pas de vidéo.</div>';release(a);break}
    state.working=-1;state.deskDone.add(i);showNow(a,'done');
    line(`<b>${esc(a.nom)}</b> → ${esc(a.message)}`);
    if(a.nom==='Sam'){document.getElementById('result').innerHTML=`<video src="${RUN.video}" controls playsinline preload="metadata"></video>`}
    release(a);
  }
  clearInterval(tick);clock.textContent=`terminé · run réel : ${RUN.duree_totale} s · pause café`;line('<b>Run terminé.</b> Vidéo prête, tout le monde retourne traîner.');
  btn.disabled=false;btn.textContent='↻ Revoir le rejeu';
}
document.getElementById('note').textContent='Rejeu du dernier vrai run, avec ses vrais résultats. La lecture est accélérée, et les durées affichées sont les vraies. '+(RUN.source==='gemini'?'Hugo écrit les questions avec Gemini et Inès les fait vérifier par une seconde IA, ce qui réduit les erreurs sans les rendre impossibles.':'Pas de clé Gemini : Hugo a pioché dans la banque de secours.')+' Noé prépare la publication, mais les comptes ne sont pas encore connectés.';
document.getElementById('play').onclick=play;
</script>
